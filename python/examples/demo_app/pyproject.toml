[project]
name = "raft-rx-demo"
version = "0.1.0"
description = "Demo application for raft-rx"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "raft-rx",
]

[project.scripts]
raft-rx-demo = "raft_rx_demo.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
raft-rx = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/raft_rx_demo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
