[project]
name = "raft-rx"
version = "0.1.0"
description = "Raft over rxnet for Python"
requires-python = ">=3.11"
dependencies = [
    "rxnet",
]

[project.scripts]
raft-rx-demo = "raft_rx.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
rxnet = { path = "../../rxnet/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
