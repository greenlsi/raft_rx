[project]
name = "raft-rx"
version = "0.1.0"
description = "Raft over rxnet for Python"
requires-python = ">=3.11"
dependencies = [
    "rxnet",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
rxnet = { path = "../../rxnet/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/raft_rx"]

[tool.hatch.build.targets.sdist]
include = [
    "src/raft_rx",
    "pyproject.toml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
